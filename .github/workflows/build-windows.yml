name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build the folder-based distribution
        run: python -m PyInstaller --noconfirm --clean CardCompile.spec

      - name: Boot check
        run: python tools/check_exe.py

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: CardCompile-windows
          path: dist/CardCompile
          if-no-files-found: error
          retention-days: 30
